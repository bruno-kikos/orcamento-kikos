<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bruno Kikos Fitness</title>

<style>

body{
    margin:0;
    background:#070b12;
    color:white;
    font-family:Arial,sans-serif;
}

.topo{
    text-align:center;
    padding:40px 20px;
}

.foto{
    width:320px;
    border-radius:20px;
    border:4px solid #ff3434;
}

h1{
    color:#ff3434;
    margin-top:20px;
    font-size:42px;
}

h2{
    color:white;
    font-size:28px;
}

.btn{
    display:inline-block;
    background:#25D366;
    color:white;
    text-decoration:none;
    padding:18px 40px;
    border-radius:12px;
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
    box-shadow:0 0 15px rgba(37,211,102,.5);
    transition:0.3s;
}

.btn:hover{
    transform:scale(1.05);
}

.cards{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:40px;
}

.card{
    background:#111827;
    width:250px;
    padding:20px;
    border-radius:15px;
}

.card h3{
    color:#ff3434;
}

p{
    line-height:1.6;
    max-width:800px;
    margin:auto;
}

</style>

</head>

<body>

<div class="topo">

<img src="bruno.jpg.jpeg" class="foto">

<h1>Bruno Kikos Fitness</h1>

<h2>Consultor Comercial Kikos | Recife - PE</h2>
